# FastReAct Nano - Zeabur Configuration
# Deploy to Zeabur.com

services:
  # Main FastReAct service
  - name: fastreact-nano
    type: service
    build:
      type: docker
      dockerfile: Dockerfile
    deploy:
      replicas: 1
      port: 9000
    env:
      - key=PORT, value=9000
      - key=FASTREACT_MODEL, sync=false
      - key=FASTREACT_API_KEY, sync=false
    healthCheck:
      http:
        path: /health
        port: 9000
