# FastReAct Nano - Render Configuration
# Deploy to Render.com

services:
  - type: web
    name: fastreact-nano
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install "fastreact-nano[all]"
    startCommand: python -m fastreact.adapters.http --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 18741
      - key: FASTREACT_MODEL
        sync: false
      - key: FASTREACT_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: fastreact-db
    plan: free
    region: oregon
