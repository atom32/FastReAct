# FastReAct Nano - Docker Compose Configuration
# Daemon 1.0 default deployment

version: '3.8'

services:
  # ==================================================
  # HTTP Agentic Service Daemon
  # ==================================================
  service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        MCP_ENABLED: "true"
    image: fastreact-nano:latest
    container_name: fastreact-service
    restart: unless-stopped
    ports:
      - "18741:18741"
    volumes:
      - workspace:/workspace
      - config:/root/.fastreact:ro
    environment:
      - FASTRACT_MODEL=${FASTRACT_MODEL:-gpt-4o-mini}
      - FASTRACT_API_KEY=${FASTRACT_API_KEY}
      - FASTRACT_API_BASE=${FASTRACT_API_BASE}
      - FASTRACT_TEMPERATURE=${FASTRACT_TEMPERATURE:-0.7}
      - FASTRACT_MAX_TOKENS=${FASTRACT_MAX_TOKENS:-4096}
      - FASTREACT_SERVICE_TOKEN=${FASTREACT_SERVICE_TOKEN:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18741/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - fastreact-network

  # ==================================================
  # Development Service
  # ==================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        MCP_ENABLED: "true"
    image: fastreact-nano:dev
    container_name: fastreact-dev
    profiles:
      - dev
    ports:
      - "18741:18741"
      - "8888:8888"
    volumes:
      - .:/app:cached
      - workspace:/workspace
      - config:/root/.fastreact
    environment:
      - FASTRACT_MODEL=${FASTRACT_MODEL:-gpt-4o-mini}
      - FASTRACT_API_KEY=${FASTRACT_API_KEY}
    env_file:
      - .env
    command: /bin/bash
    networks:
      - fastreact-network
    working_dir: /app

  # ==================================================
  # Monitoring Service (Prometheus + Grafana)
  # ==================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: fastreact-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fastreact-network

  grafana:
    image: grafana/grafana:latest
    container_name: fastreact-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - fastreact-network

# ==================================================
# Networks
# ==================================================
networks:
  fastreact-network:
    driver: bridge
    name: fastreact-network

# ==================================================
# Volumes
# ==================================================
volumes:
  workspace:
    name: fastreact-workspace
  config:
    name: fastreact-config
  prometheus-data:
    name: fastreact-prometheus-data
  grafana-data:
    name: fastreact-grafana-data
