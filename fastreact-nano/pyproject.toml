[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastreact-nano"
version = "2.0.0"
description = "Lightweight ReAct agent with event-driven architecture"
readme = "README_NANO.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FastReAct Team", email = "contact@fastreact.dev"}
]
keywords = ["react", "agent", "llm", "ai", "lite", "fast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies - minimal!
dependencies = [
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

# Optional adapters - install only what you need
[project.optional-dependencies]
# CLI adapter
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# HTTP adapter
http = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

# WebSocket adapter
ws = [
    "websockets>=12.0",
]

# Full gateway (HTTP + WebSocket + sessions)
gateway = [
    "fastapi>=0.104.0",
    "websockets>=12.0",
    "aiofiles>=23.0.0",
]

# Web adapter (Streamlit)
web = [
    "streamlit>=1.28.0",
]

# Feishu adapter (Official SDK)
feishu = [
    "lark-oapi>=1.5.0",
]

# MCP (Model Context Protocol) support
mcp = [
    # No additional dependencies needed for MCP client
    # MCP is built-in to FastReAct core
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "faker>=20.0.0",
]

# Production dependencies
prod = [
    "fastreact-nano[feishu,gateway,mcp]",
    "gunicorn>=21.0.0",
    "prometheus-client>=0.19.0",
]

# Everything (for development/testing)
all = [
    "fastreact-nano[cli,gateway,web,feishu,mcp,dev]",
]

[project.urls]
Homepage = "https://github.com/atom32/FastReAct"
Repository = "https://github.com/atom32/FastReAct"
Issues = "https://github.com/atom32/FastReAct/issues"

[project.scripts]
# CLI command (when cli adapter is installed)
fastreact = "fastreact.adapters.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py11']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
