[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastreact"
dynamic = ["version"]  # 版本从 __init__.py 动态读取
description = "企业级 ReAct Agent 基础设施框架 - 开箱即用，生产就绪"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FastReAct Team", email = "contact@fastreact.dev"}
]
keywords = ["react", "agent", "llm", "ai", "framework", "mcp", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "mcp>=1.25.0",
    "rich>=13.0.0",  # For beautiful CLI output
    "pyyaml>=6.0",   # For YAML config files
    "click>=8.0.0",  # For CLI framework
    "prompt-toolkit>=3.0.0",  # For interactive CLI with auto-completion
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.entry-points."console_scripts"]
fastreact = "fastreact.cli.main:cli"

[project.urls]
Homepage = "https://github.com/atom32/FastReAct"
Documentation = "https://github.com/atom32/FastReAct/wiki"
Repository = "https://github.com/atom32/FastReAct"
Issues = "https://github.com/atom32/FastReAct/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fastreact.__version__"}

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
